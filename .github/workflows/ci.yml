name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs more than read access to the repository.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      # Actions are pinned to commit hashes; Dependabot proposes updates (see .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # The project has no runtime dependencies, so there is nothing to install.
      - name: Unit and end-to-end tests
        run: npm test
      - name: Pack the package and run it through npx
        run: npm run test:package
