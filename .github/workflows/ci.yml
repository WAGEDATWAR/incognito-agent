name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs more than read access to the repository.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      # Actions are pinned to commit hashes; Dependabot proposes updates (see .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # The project has no runtime dependencies, so there is nothing to install.
      - name: Unit and end-to-end tests
        run: npm test
      - name: Pack the package and run it through npx
        run: npm run test:package

  # The one path the matrix above cannot exercise: a real Linux keyring through secret-tool.
  keyring:
    name: keyring (ubuntu, secret-tool)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install a keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Round-trip a key through the real keyring
        shell: bash
        run: |
          # Start a private session bus and a keyring unlocked with a throwaway password, check that secret-tool can
          # store and read before running the test, and surface the tail of the output as annotations on failure.
          set +e
          dbus-run-session -- bash -c '
            eval "$(echo -n "ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
            printf probe | secret-tool store --label=probe service probe kind smoke
            echo "smoke store exit: $?"
            echo "smoke lookup: $(secret-tool lookup service probe kind smoke) (exit $?)"
            ACP_TEST_KEYRING=1 node test/keyring.js
          ' 2>&1 | tee keyring.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 25 keyring.log | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit "$status"

  # Another path the matrix cannot exercise: a real macOS Keychain through the security tool.
  keychain:
    name: keychain (macos, security)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Round-trip a key through the real Keychain
        shell: bash
        run: |
          # A throwaway default keychain, unlocked, so the test does not depend on the runner's own state.
          set +e
          security create-keychain -p ci-keychain ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci-keychain ci.keychain
          security set-keychain-settings ci.keychain
          # Lookups search the keychain list, not just the default, so put the new one first.
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | tr -d '"')
          ACP_TEST_KEYCHAIN=1 node test/keychain.js 2>&1 | tee keychain.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { grep "probe" keychain.log; tail -n 25 keychain.log; } | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit "$status"

